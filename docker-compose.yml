services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundingflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fundingflow}
      POSTGRES_DB: fundingflow
    volumes:
      - fundingflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundingflow -d fundingflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fundingflow:${POSTGRES_PASSWORD:-fundingflow}@db:5432/fundingflow
    command: ["cli", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://fundingflow:${POSTGRES_PASSWORD:-fundingflow}@db:5432/fundingflow
      PORT: 3001
      RUST_LOG: ${RUST_LOG:-info}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      FEC_API_KEY: ${FEC_API_KEY:-}
      REGULATIONS_GOV_API_KEY: ${REGULATIONS_GOV_API_KEY:-}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-FundingFlow admin@example.com}
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://api:3001
    environment:
      API_URL: http://api:3001
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  fundingflow-postgres:
