services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fundingflow
      POSTGRES_PASSWORD: fundingflow
      POSTGRES_DB: fundingflow_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundingflow -d fundingflow_test"]
      interval: 1s
      timeout: 3s
      retries: 10
