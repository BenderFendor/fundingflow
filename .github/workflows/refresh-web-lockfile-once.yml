name: Refresh web lockfile once

on:
  push:
    branches:
      - agent/finish-runtime-and-delivery

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-runtime-and-delivery
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.13.1
      - name: Refresh and commit lockfile
        shell: bash
        run: |
          pnpm install --lockfile-only
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "Refresh frontend lockfile"
          git push origin HEAD:agent/finish-runtime-and-delivery
