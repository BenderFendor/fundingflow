name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fundingflow
          POSTGRES_PASSWORD: fundingflow
          POSTGRES_DB: fundingflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fundingflow -d fundingflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://fundingflow:fundingflow@localhost:5432/fundingflow_test
      TEST_DATABASE_URL: postgres://fundingflow:fundingflow@localhost:5432/fundingflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        id: formatting
        continue-on-error: true
        shell: bash
        run: |
          if cargo fmt --all --check; then
            exit 0
          fi
          cargo fmt --all
          git diff -- . > rustfmt.patch
          exit 1
      - name: Upload rustfmt patch
        if: steps.formatting.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 3
      - name: Enforce formatting
        if: steps.formatting.outcome == 'failure'
        run: |
          echo "::error::Rust sources need formatting. Download the rustfmt-patch artifact."
          exit 1
      - name: Compile
        run: cargo check --locked --workspace --all-targets --all-features
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Unit tests
        run: cargo test --locked --workspace --all-features
      - name: Migrate integration database
        run: cargo run --locked --bin cli -- migrate
      - name: Database integration tests
        run: cargo test --locked -p db --test db_integration -- --ignored --nocapture --test-threads=1

  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: fundingflow-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: false
          tags: fundingflow-web:ci
          build-args: NEXT_PUBLIC_API_URL=http://api:3001
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
