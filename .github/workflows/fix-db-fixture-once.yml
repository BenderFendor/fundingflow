name: Fix database fixture once

on:
  push:
    branches:
      - agent/finish-runtime-and-delivery

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finish-runtime-and-delivery
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Correct identifier fixtures and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/db/tests/common/mod.rs")
          text = path.read_text()
          old = '''            &format!("{}-{}", name.to_uppercase().replace(' ', ""), &run_id[..8]),'''
          new = '''            &if *name == "Tesla Inc" {
              "UEI-TESLAINC".to_string()
            } else {
              format!(
                "UEI-{}-{}",
                name.to_uppercase().replace(' ', ""),
                &run_id[..8]
              )
            },'''
          if old not in text:
              raise SystemExit("expected fixture expression was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/db/tests/common/mod.rs
          git commit -m "Fix integration identifier fixtures"
          git push origin HEAD:agent/finish-runtime-and-delivery
